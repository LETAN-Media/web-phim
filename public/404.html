<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#010818" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>404 — Trang không tồn tại</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='16' rx='5' fill='%23e50914'/%3E%3Cpath d='M10 9.2v5.6L14.8 12z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preload" as="image" href="/images/404-main.webp" fetchpriority="high" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  html { background: #010818; -webkit-text-size-adjust: 100%; }
  body {
    color: #fff;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    text-rendering: optimizeSpeed;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ First-screen stage (stable viewport) ============ */
  .nf-page {
    position: fixed; inset: 0;
    height: 100vh; /* iOS fallback */
    overflow: hidden;
    background:
      radial-gradient(90% 60% at 50% 78%, rgba(38,80,190,.28) 0%, rgba(38,80,190,0) 60%),
      radial-gradient(120% 85% at 50% 0%, #0a1430 0%, #010818 65%);
  }
  @supports (height: 100dvh) { .nf-page { height: 100dvh; } }

  /* ============ HERO IMAGE — full-screen poster ============ */
  .nf-hero {
    position: absolute; inset: 0; z-index: 1;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
    pointer-events: none;
    user-select: none; -webkit-user-select: none;
    -webkit-user-drag: none;
  }
  /* Desktop: ảnh dọc -> poster giữa, hai bên là backdrop blur cùng ảnh (không kéo ngang) */
  .nf-backdrop {
    position: absolute; inset: -40px; z-index: 0;
    background: url("/images/404-main.webp") center top / cover no-repeat, #010818;
    filter: blur(28px) brightness(.55) saturate(1.05);
    display: none;
  }
  @media (min-width: 900px) {
    .nf-backdrop { display: block; }
    .nf-hero {
      left: 50%; right: auto; transform: translateX(-50%);
      width: min(100vw, calc(100vh * 0.62));
    }
    @supports (height: 100dvh) {
      .nf-hero { width: min(100vw, calc(100dvh * 0.62)); }
    }
  }

  /* Ảnh chưa có -> giữ gradient nền, không render khung/placeholder rectangle */

  /* ============ Overlay poster (đúng spec) ============ */
  .nf-overlay {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(85% 50% at 50% 100%, rgba(40,90,220,.16) 0%, rgba(40,90,220,0) 65%),
      linear-gradient(to bottom,
        rgba(0,0,0,0.10) 0%,
        rgba(0,0,0,0.00) 30%,
        rgba(1,8,24,0.10) 55%,
        rgba(1,8,24,0.65) 78%,
        rgba(1,8,24,0.96) 100%);
  }

  /* ============ BADGE top center ============ */
  .nf-badge {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 50%; transform: translateX(-50%);
    z-index: 4;
    display: inline-flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 18px;
    border-radius: 999px;
    background: rgba(6,14,34,.55);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid rgba(80,140,255,.45);
    box-shadow: 0 0 18px rgba(60,110,255,.28), inset 0 0 0 1px rgba(255,255,255,.06);
    font-size: 13px; font-weight: 800; letter-spacing: .22em;
    color: #eaf1ff; white-space: nowrap;
    text-indent: .22em; /* cân lại letter-spacing cuối */
  }
  .nf-badge i {
    width: 7px; height: 7px; border-radius: 50%;
    background: #5b8cff; box-shadow: 0 0 10px rgba(91,140,255,.9);
  }

  /* ============ HEADLINE + SUB ============ */
  .nf-head {
    position: fixed; left: 12px; right: 12px;
    top: calc(env(safe-area-inset-top, 0px) + 11vh);
    z-index: 3; text-align: center; pointer-events: none;
  }
  @supports (top: 1dvh) {
    .nf-head { top: calc(env(safe-area-inset-top, 0px) + 11dvh); }
  }
  .nf-title {
    margin: 0;
    /* Luôn 1 dòng: chữ co theo viewport để không bao giờ xuống hàng */
    white-space: nowrap;
    font-size: clamp(24px, 7.2vw, 54px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: .015em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 2px 18px rgba(1,8,24,.6), 0 1px 3px rgba(1,8,24,.5);
  }
  .nf-sub {
    margin: 12px auto 0;
    white-space: nowrap;
    font-size: clamp(13px, 3.7vw, 18px);
    line-height: 1.25;
    font-weight: 700;
    color: rgba(255,255,255,.9);
    text-shadow: 0 1px 10px rgba(1,8,24,.55);
  }

  /* ============ CTA — sát đáy như reference ============ */
  .nf-cta {
    position: fixed; left: 0; right: 0;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    z-index: 4;
    display: flex; gap: 10px;
    padding-inline: 20px;
  }
  .nf-btn {
    flex: 1 1 0;
    height: clamp(54px, 7.5vh, 60px);
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 16px;
    font: inherit; font-size: clamp(16px, 4.4vw, 18px); font-weight: 800;
    letter-spacing: .01em;
    color: #0a1020; text-decoration: none; white-space: nowrap;
    background: linear-gradient(180deg, #ffffff, #e8edf7);
    border: 1px solid rgba(80,140,255,.75);
    box-shadow:
      0 0 22px rgba(60,110,255,.45),
      inset 0 0 0 1px rgba(255,255,255,.8);
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .nf-btn:active { transform: scale(.98); }
  .nf-btn:focus-visible { outline: 2px solid #9db9ff; outline-offset: 3px; }

  /* Màn thấp (iPhone SE landscape-ish / 568px): still 1 screen, nothing clipped */
  @media (max-height: 600px) {
    .nf-head { top: calc(env(safe-area-inset-top, 0px) + 7vh); }
    .nf-title { font-size: clamp(22px, 6.8vw, 40px); }
    .nf-sub { margin-top: 8px; }
    .nf-badge { height: 30px; padding: 0 14px; }
    .nf-btn { height: 54px; }
  }
</style>
</head>
<body>

<div class="nf-page">
  <div class="nf-backdrop" aria-hidden="true"></div>
  <!-- HERO chính: upload vào /images/404-main.webp. Ảnh chưa có -> gradient tối, không placeholder rectangle -->
  <img class="nf-hero" src="/images/404-main.webp" alt="" fetchpriority="high" decoding="async" onerror="this.remove()" />
  <div class="nf-overlay" aria-hidden="true"></div>
</div>

<span class="nf-badge" aria-hidden="true"><i></i>PRISMX</span>

<header class="nf-head">
  <h1 class="nf-title">Trang không tồn tại</h1>
  <p class="nf-sub">Liên kết bạn truy cập không còn khả dụng.</p>
</header>

<nav class="nf-cta" aria-label="Liên kết nhanh">
  <a class="nf-btn" href="https://phim.callboy76.live">Xem Phim 18+</a>
  <a class="nf-btn" href="https://truyen.callboy76.live/truyen">Đọc Truyện 18+</a>
</nav>

</body>
</html>
